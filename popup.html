<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=Libertinus+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-shell">
      <header class="header">
        <div class="header-top">
          <div class="brand-row">
            <span class="material-icons-outlined">lightbulb</span>
            <div>
              <h1>Claude Tips</h1>
            </div>
          </div>
          <div class="filter-container">
            <button class="filter-toggle" aria-label="Filter settings">
              <span class="material-icons-outlined">tune</span>
            </button>
            <div class="filter-menu">
              <div class="filter-menu-header">Filter by category</div>
              <div class="filter-mode-control">
                <button class="random-mode-toggle" type="button">
                  <span class="material-icons-outlined">shuffle</span>
                  <span>Random tip mode</span>
                </button>
              </div>
              <div class="filter-options">
                <!-- Categories will be populated by JS -->
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="content-area">
        <!-- Tips are rendered dynamically by popup.js -->
      </main>

      <footer class="footer">
        <a
          class="footer-action"
          href="https://platform.claude.com/docs/"
          target="_blank"
          rel="noreferrer"
        >
          <span class="material-icons-outlined">menu_book</span>
          Claude Documentation
        </a>
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
